[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dvp"
version = "5.1.0"
description = "Delphix Virtualization Platform SDK"
readme = "README.md"
requires-python = ">=3.11, <3.12"
authors = [
    {name = "Delphix", email = "virtualization-plugins@delphix.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["virtualization", "plugin"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
# Sibling-package pins; .bumpversion.cfg keeps these in sync with [project].version.
dependencies = [
    "dvp-common == 5.1.0",
    "dvp-libs == 5.1.0",
    "dvp-platform == 5.1.0",
    "dvp-tools == 5.1.0",
]

[project.optional-dependencies]
dev = [
    "bump2version == 1.0.1",
    "packaging == 26.0",
    "pluggy == 1.6.0",
    "pyparsing == 3.3.2",
    "pytest == 9.0.3",
    "six == 1.17.0",
    "zipp == 4.1.0",
]

[project.urls]
Homepage = "https://developer.delphix.com"

[tool.setuptools]
package-dir = {"" = "src/main/python"}

[tool.setuptools.packages.find]
where = ["src/main/python"]