[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dvp-tools"
version = "5.1.0"
description = "Delphix Virtualization SDK Tools"
readme = "README.md"
requires-python = ">=3.11, <3.12"
authors = [
    {name = "Delphix", email = "virtualization-plugins@delphix.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
# Sibling-package pins (dvp-libs, dvp-platform) are kept in sync via .bumpversion.cfg.
dependencies = [
    "attrs >= 25.3, < 26.2",
    "certifi >= 2024, < 2025",
    "click == 7.1.2",
    "click-configfile == 0.2.3",
    "configparser >= 7.2, < 7.3",
    "dvp-libs == 5.1.0",
    "dvp-platform == 5.1.0",
    "flake8 >= 7.3, < 7.4",
    "httpretty >= 1.0, < 1.1",
    "importlib-resources >= 6.5, < 6.6",
    "jinja2 >= 3.1, < 3.2",
    "jsonschema >= 4.25, < 4.26",
    "MarkupSafe >= 3.0, < 3.1",
    "pkgutil_resolve_name == 1.3.10",
    "pyyaml >= 6, < 7",
    "requests >= 2.32, < 2.33",
    "six >= 1.17, < 1.18",
    "zipp >= 3.23, < 3.24",
]

[project.optional-dependencies]
dev = [
    "bump2version == 1.0.1",
    "coverage == 7.13.5",
    "entrypoints == 0.4",
    "flake8 == 7.3.0",
    "httpretty == 1.0.5",
    "isort == 8.0.1",
    "mccabe == 0.7.0",
    "mock == 5.2.0",
    "more-itertools == 10.8.0",
    "packaging == 26.0",
    "pluggy == 1.6.0",
    "pycodestyle == 2.14.0",
    "pyflakes == 3.4.0",
    "pyparsing == 3.3.2",
    "pytest == 9.0.3",
    "pytest-cov == 7.1.0",
    "six == 1.17.0",
    "yapf == 0.43.0",
    "zipp == 3.23.0",
]

[project.urls]
Homepage = "https://developer.delphix.com"

[project.scripts]
dvp = "dlpx.virtualization._internal.cli:delphix_sdk"

[tool.setuptools]
package-dir = {"" = "src/main/python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src/main/python"]

[tool.coverage.run]
source = ["src/main/python"]
omit = [
    "*/plugin_template/*",
    "*.template",
]